[extend]
useDefault = true

[[allowlists]]
description = "Test-only secrets for local runs and CI, used nowhere else."
paths = ['''(^|/)tests/integration/\.env$''']

[[allowlists]]
description = "The characters of a Bigpicture accession, not a secret."
regexes = ['''abcdefghjkmnpqrstuvwxyz23456789''']
