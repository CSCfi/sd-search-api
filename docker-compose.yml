services:
  bp-sd-search-api:
    profiles: [ "dev" ]
    build:
      dockerfile: ./dockerfiles/Dockerfile
      context: .
    image: cscfi/sd-search-api
    command: [ "uv", "run", "sd_search_api" ]
    env_file: tests/integration/.env
    environment:
      - DEPLOYMENT_TYPE=Bigpicture
      - POSTGRES_HOST=bp-postgres
      - POSTGRES_DB=${BP_POSTGRES_DB}
      - POSTGRES_PORT=${BP_POSTGRES_PORT}
      - OPENSEARCH_HOST=opensearch
    depends_on:
      bp-postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  bp-postgres:
    profiles: [ "dev" ]
    image: postgres:18-alpine
    hostname: bp-postgres
    env_file: tests/integration/.env
    environment:
      - POSTGRES_DB=${BP_POSTGRES_DB}
      - PGPORT=${BP_POSTGRES_PORT}
    volumes:
      - ./search_api/database/schema/bigpicture/create.sql:/docker-entrypoint-initdb.d/10_bigpicture.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p ${BP_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  opensearch:
    profiles: [ "dev" ]
    image: opensearchproject/opensearch:2
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Sd@Search9x!}
      - plugins.security.disabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_cluster/health -u admin:${OPENSEARCH_PASSWORD:-Sd@Search9x!} | grep -qv '\"status\":\"red\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  opensearch-dashboards:
    profiles: [ "dev" ]
    image: opensearchproject/opensearch-dashboards:2
    hostname: opensearch-dashboards
    entrypoint: [ "/usr/share/opensearch-dashboards/entrypoint.sh" ]
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-Sd@Search9x!}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    volumes:
      - ./dockerfiles/opensearch-dashboards-entrypoint.sh:/usr/share/opensearch-dashboards/entrypoint.sh
    depends_on:
      opensearch:
        condition: service_healthy
