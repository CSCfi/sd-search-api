services:
  sd-search-api:
    build:
      dockerfile: ./dockerfiles/Dockerfile
      context: .
    image: cscfi/sd-search-api
    command: [ "uv", "run", "sd_search_api" ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
