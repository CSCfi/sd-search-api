services:
  mockauth:
    profiles: [ "dev" ]
    build:
      dockerfile: ./dockerfiles/Dockerfile.mockauth
      context: .
    image: cscfi/sd-search-api-mockauth
    entrypoint: [ "uv", "run", "python", "tests/integration/mockauth.py" ]
  bp-sd-search-api:
    profiles: [ "dev" ]
    build:
      dockerfile: ./dockerfiles/Dockerfile
      context: .
    image: cscfi/sd-search-api
    command: [ "uv", "run", "sd_search_api" ]
    environment:
      - DEPLOYMENT_TYPE=Bigpicture
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV}
      - POSTGRES_HOST=bp-postgres
      - POSTGRES_DB=${BP_POSTGRES_DB}
      - POSTGRES_PORT=${BP_POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_USER=${OPENSEARCH_USER}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - SNOWSTORM_URL=${SNOWSTORM_URL}
      - ADMIN_KEY=${ADMIN_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - BASE_URL=${BASE_URL}
      - OIDC_URL=${OIDC_URL:-http://mockauth:8080}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL}
      - OIDC_SECURE_COOKIE=${OIDC_SECURE_COOKIE:-true}
      - JWT_KEY=${JWT_KEY}
    depends_on:
      bp-postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      mockauth:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  bp-postgres:
    profiles: [ "dev" ]
    image: postgres:18-alpine
    hostname: bp-postgres
    environment:
      - POSTGRES_DB=${BP_POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPORT=${BP_POSTGRES_PORT}
    volumes:
      - ./search_api/database/schema/create.sql:/docker-entrypoint-initdb.d/10_create.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p ${BP_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  opensearch:
    profiles: [ "dev" ]
    image: opensearchproject/opensearch:2
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - plugins.security.disabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_cluster/health -u admin:${OPENSEARCH_PASSWORD} | grep -qv '\"status\":\"red\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  opensearch-dashboards:
    profiles: [ "dev" ]
    image: opensearchproject/opensearch-dashboards:2
    hostname: opensearch-dashboards
    entrypoint: [ "/usr/share/opensearch-dashboards/entrypoint.sh" ]
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    volumes:
      - ./dockerfiles/opensearch-dashboards-entrypoint.sh:/usr/share/opensearch-dashboards/entrypoint.sh
    depends_on:
      opensearch:
        condition: service_healthy
