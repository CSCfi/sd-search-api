apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: sd-search
  labels:
    app: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: your-registry.example.com/sd-search/opensearch-dashboards:2
          ports:
            - containerPort: 5601
              name: http
              protocol: TCP
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://opensearch:9200"]'
            - name: OPENSEARCH_USERNAME
              value: admin
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: OPENSEARCH_PASSWORD
            - name: OPENSEARCH_SSL_VERIFICATIONMODE
              value: none
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  curl -fs http://localhost:5601/api/status \
                    -u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" \
                    | grep -qv '"state":"red"'
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  curl -fs http://localhost:5601/api/status \
                    -u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" \
                    | grep -qv '"state":"red"'
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "250m"
