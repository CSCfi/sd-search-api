apiVersion: v1
kind: ConfigMap
metadata:
  name: sd-search-api-config
  namespace: sd-search
data:
  DEPLOYMENT_TYPE: ""
  DEPLOYMENT_ENV: ""

  # OpenSearch service within the namespace
  OPENSEARCH_HOST: ""
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USER: ""
  # Remove once OpenSearch has a certificate signed by a trusted CA, and set
  # OPENSEARCH_CA_CERTS if that CA is not among the system ones.
  OPENSEARCH_VERIFY_CERTS: "false"

  # External PostgreSQL instance
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ""

  # Snowstorm SNOMED CT server
  SNOWSTORM_URL: ""

  # Set to "true" to enable POST /ai/*; also set LLM_* vars in the secret.
  # Users' queries are sent to the LLM. For sensitive data, use a self-hosted
  # LLM. Bigpicture requires one.
  FEATURE_AI: "false"

  # OIDC Relying Party login (LifeScience AAI)
  # Must be the UI's own hostname, not the API's — the OIDC callback sets a
  # host-only session cookie, and the UI's own /api/ calls need to see it.
  BASE_URL: ""
  OIDC_URL: ""
  # offline_access: LS AAI issues the refresh token behind /refresh only when it is
  # requested, and the client registration must allow it.
  OIDC_SCOPE: "openid profile email offline_access"
  # Send the user back to the UI's search page after login/logout instead of
  # the default (this API's own /docs).
  OIDC_REDIRECT_URL: ""
