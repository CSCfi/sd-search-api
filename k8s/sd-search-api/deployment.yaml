apiVersion: apps/v1
kind: Deployment
metadata:
  name: sd-search-api
  namespace: sd-search
  labels:
    app: sd-search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sd-search-api
  template:
    metadata:
      labels:
        app: sd-search-api
    spec:
      containers:
        - name: sd-search-api
          image: your-registry.example.com/sd-search/sd-search-api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sd-search-api-config
            - secretRef:
                name: sd-search-api-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
