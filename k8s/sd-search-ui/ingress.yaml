# Generic-k8s alternative to route.yaml (route.openshift.io/v1 only exists on
# OpenShift). Use this instead of the Route on a vanilla cluster; not both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sd-search-ui
  namespace: sd-search
  labels:
    app: sd-search-ui
  annotations:
    # Assumes the ingress-nginx controller; adjust or remove to match your
    # cluster's ingress controller.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sd-search-ui.apps.example.com
      # Must already exist in this namespace (e.g. provisioned by cert-manager,
      # or created manually). Remove this tls: block to serve plain HTTP.
      secretName: sd-search-ui-tls
  rules:
    - host: sd-search-ui.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sd-search-ui
                port:
                  name: http
