[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_api"]


[project]
name = "sd-search-api"
version = "0.1.0"
description = "Sensitive data search API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "fsspec>=2026.2.0",
    "aiocache>=0.12.3",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "lxml>=6.0.2",
    "opensearch-py[async]>=3.1.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "types-jsonschema>=4.26.0.20260508",
    "types-requests>=2.33.0.20260508",
    "uvicorn>=0.47.0",
    "pydantic-ai>=0.3.0",
    "pydantic-settings>=2.9.1",
    "isodate>=0.7.2",
]

[dependency-groups]
dev = [
    "locust>=2.43.4",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
    "tox>=4.49.1",
    "tox-uv>=1.33.4",
    "types-lxml>=2026.2.16",
]

[project.optional-dependencies]

tox = [
    # mypy
    "mypy>=1.19.1",
    # pytest
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    # ruff
    "ruff>=0.15.6",
]

[project.scripts]
sd_search_api = "search_api.main:main"


[tool.pytest.ini_options]
markers = [
    "external: marks tests that require external network access (deselect with '-m not external')",
]
