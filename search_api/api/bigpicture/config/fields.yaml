# Bigpicture OpenSearch field configuration.
#
# Loaded and validated at startup. Defines Beacon /filtering_terms response
# and the generated OpenSearch index. Regenerate the OpenSearch index after
# editing.
#
# Conventions:
#   - The field name is the "id".
#   - "group" is the OpenSearch nested group a field lives in; omit it for a
#     top-level field. The full index path is "<group>.<id>".
#
#     Grouping follows the source XML hierarchy but nested groups are created only
#     when needed. A nested group is required when an object can repeat within
#     an image and has several correlated fields or uses qualifiers.
#     Objects meeting this requirement:
#       - specimen: a block can be sampled from many specimens, and a specimen has
#         several correlated fields. A specimen is extracted from exactly one
#         biological being, so the biological being's fields can be flattened in
#         the specimen. The block has a single field (block_preparation)
#         with nothing to correlate and can also be flattened in the specimen.
#       - staining: a slide carries several stains, each with correlated fields.
#       - finding: an image can have several non-clinical findings, each with
#         several correlated fields.
#       - diagnosis: an image can have several clinical diagnoses. Nested group
#         is required so each diagnosis can have qualifiers.
#     The slide and case have no searchable fields and do not need to be
#     represented as nested groups.
#   - "ui_group" is the UI group id this term belongs to.
#   - "ui_display" controls whether the term is shown in the UI.
#   - Quote ontology concept codes (e.g. "410607006"). Unquoted, they are parsed
#     as integers and validation rejects them.
#   - "type" is one of: text, keyword, controlledValue, ontology,
#     ontologyOrValue, iso8601Range, integer.

filtering_terms:
  - id: dataset_title
    type: text
    scopes: [ clinical, non_clinical ]
    label: "Dataset title"
    description: "The title of the dataset"
    ui_group: "description"
    ui_display: false

  - id: dataset_description
    type: text
    scopes: [ clinical, non_clinical ]
    label: "Dataset description"
    description: "The description of the dataset"
    ui_group: "description"

  - id: animal_species
    type: ontology
    group: specimen
    scopes: [ non_clinical ]
    label: "Biological species"
    description: "Species of the biological being"
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "410607006" ]  # Organism (organism)
      include_descendants: true
    ui_group: "subject"

  - id: anatomical_site
    type: ontology
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Anatomical site"
    description: >-
      The anatomical site from which the specimen originated, typically at the
      organ level. If no organ can be identified, use an equivalent anatomical
      region.
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "123037004" ]  # Body structure (body structure)
      include_descendants: true
    multivalued: true
    ui_group: "subject"

  - id: sex
    type: controlledValue
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Sex"
    description: "The sex of the biological being"
    controlledValues: [ "Male", "Female", "Not-known", "Other" ]
    ui_group: "subject"

  - id: age_at_extraction
    type: iso8601Range
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Age at extraction"
    description: "The age of the biological being at the time point of extraction of the specimen."
    ui_group: "subject"

  - id: block_preparation
    type: ontology
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Block preparation"
    description: "The preservation technique used."
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids:
        - "311731000"  # Paraffin wax (substance)
        - "433469005"  # Frozen section embedding medium (substance)
        - "61088005"   # Plastic (substance)
        - "10249006"   # Agar (substance)
        - "65345002"   # Epoxy resin (substance)
        - "261712009"  # Acrylic polymer (substance)
      # Exactly these media, not their descendants.
      include_descendants: false
    ui_group: "sample"

  - id: specimen_type
    type: ontology
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Specimen type"
    description: "The type of the specimen."
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "91720002" ]  # Body substance (substance)
      include_descendants: true
    ui_group: "sample"

  - id: fixation_type
    type: ontologyOrValue
    group: specimen
    scopes: [ clinical, non_clinical ]
    label: "Fixation type"
    description: "The type of fixation used in the process of the creation of the specimen."
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "1388477003" ]  # Tissue fixative (product)
      include_descendants: true
    ui_group: "sample"

  - id: staining_target
    type: keyword
    group: staining
    scopes: [ clinical, non_clinical ]
    label: "Staining target"
    description: "The specific target of the stain"
    ui_group: "staining"

  - id: staining_procedure
    type: ontologyOrValue
    group: staining
    scopes: [ clinical, non_clinical ]
    label: "Staining procedure"
    description: "The name of the staining procedure that was performed to stain the slide"
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "127790008" ]  # Staining method (procedure)
      include_descendants: true
    ui_group: "staining"

  - id: staining_substance
    type: ontologyOrValue
    group: staining
    scopes: [ clinical, non_clinical ]
    label: "Staining substance"
    description: "The staining substance that binds to parts of the tissues of the slide"
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "397165007" ]  # Stain
      include_descendants: true
    ui_group: "staining"

  - id: diagnosis
    type: ontology
    group: diagnosis
    scopes: [ clinical ]
    label: "Diagnosis"
    description: "Diagnosis known to apply to one more image linked to an observation."
    ontology:
      id: SCTID
    ontologyRestriction:
      concept_ids: [ "138875005" ]  # SNOMED CT Concept (root)
      include_descendants: true
    ui_group: "clinical"

  - id: finding
    type: ontology
    group: finding
    scopes: [ non_clinical ]
    label: "Finding"
    description: "Microscopic finding (MISTRESC)."
    ontology:
      id: SEND
    ui_group: "finding"

  - id: finding_severity
    type: ontology
    group: finding
    scopes: [ non_clinical ]
    label: "Severity"
    description: "Severity of the microscopic finding (MISEV)."
    ontology:
      id: SEND
    ontologyRestriction:
      concept_ids: [ "C90000" ]  # SEND Severity (SEV)
      include_descendants: true
    ui_group: "finding"

  - id: finding_chronicity
    type: ontology
    group: finding
    scopes: [ non_clinical ]
    label: "Chronicity"
    description: "Chronicity of the microscopic finding (MICHRON)."
    ontology:
      id: SEND
    ontologyRestriction:
      concept_ids: [ "C120529" ]  # Chronicity (CHRNCTY)
      include_descendants: true
    ui_group: "finding"

  - id: finding_distribution
    type: ontology
    group: finding
    scopes: [ non_clinical ]
    label: "Distribution"
    description: "Distribution of the microscopic finding (MIDISTR)."
    ontology:
      id: SEND
    ontologyRestriction:
      concept_ids: [ "C120530" ]  # Distribution (DSTRBN)
      include_descendants: true
    ui_group: "finding"

  - id: finding_result_category
    type: ontology
    group: finding
    scopes: [ non_clinical ]
    label: "Result category"
    description: "Result category (MIRESCAT)."
    ontology:
      id: SEND
    ontologyRestriction:
      concept_ids: [ "C90017" ]  # Microscopic Histopathology Result Category (MIRESCAT)
      include_descendants: true
    ui_group: "finding"

# Fields that are indexed in OpenSearch but are not filterable.
# All are top-level (no group).
non_filtering_fields:
  - id: image_id
    type: keyword

  - id: dataset_id
    type: keyword

  - id: dataset_image_cnt
    type: integer

  - id: dataset_short_name
    type: text
