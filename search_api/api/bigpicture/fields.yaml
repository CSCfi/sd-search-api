# Bigpicture OpenSearch field configuration.
#
# Loaded and validated at startup. Defines Beacon /filtering_terms response
# and the generated OpenSearch index. Regenerate the OpenSearch index after
# editing.
#
# Conventions:
#   - The field name is the "id".
#   - "group" is the OpenSearch nested container a field lives in; omit it for a
#     top-level field. The full index path is "<group>.<id>".
#
#     Grouping follows the source XML hierarchy but nested containers are created only
#     when needed. A nested container is required when an object can repeat within
#     an image and has several correlated fields.
#     Only two objects meet this requirement:
#       - specimen: a block can be sampled from many specimens, and a specimen has
#         several correlated fields. A specimen is extracted from exactly one
#         biological being, so the biological being's fields can be flattened in
#         the specimen. The block has a single field (block_preparation)
#         with nothing to correlate and can also be flattened in the specimen.
#       - staining: a slide carries several stains, each with correlated fields.
#     The slide and case have no searchable fields and do not need to be
#     represented as nested containers.
#   - "ui_group" is the UI group id this term belongs to.
#   - "ui_display" controls whether the term is shown in the UI.
#   - Quote ontology concept codes (e.g. "410607006"). Unquoted, they are parsed
#     as integers and validation rejects them.
#   - "type" is one of: text, keyword, controlledValue, ontology,
#     ontologyOrValue, iso8601Range, integer.

filtering_terms:
  - id: dataset_title
    type: text
    scopes: [ clinical ]
    label: "Dataset title"
    description: "The title of the dataset"
    ui_group: "description"
    ui_display: false

  - id: dataset_description
    type: text
    scopes: [ clinical ]
    label: "Dataset description"
    description: "The description of the dataset"
    ui_group: "description"

  - id: animal_species
    type: ontology
    group: specimen
    scopes: [ clinical ]
    label: "Biological species"
    description: "Species of the biological being"
    ontology:
      id: SCTID
    ontologyConcept: "410607006"  # Organism (organism)
    ui_group: "subject"
    ui_display: false

  - id: anatomical_site
    type: ontology
    group: specimen
    scopes: [ clinical ]
    label: "Anatomical site"
    description: >-
      The anatomical site from which the specimen originated, typically at the
      organ level. If no organ can be identified, use an equivalent anatomical
      region.
    ontology:
      id: SCTID
    ontologyConcept: "123037004"  # Body structure (body structure)
    multivalued: true
    ui_group: "subject"

  - id: sex
    type: controlledValue
    group: specimen
    scopes: [ clinical ]
    label: "Sex"
    description: "The sex of the biological being"
    controlledValues: [ "Male", "Female", "Not-known", "Other" ]
    ui_group: "subject"

  - id: age_at_extraction
    type: iso8601Range
    group: specimen
    scopes: [ clinical ]
    label: "Age at extraction"
    description: "The age of the biological being at the time point of extraction of the specimen."
    ui_group: "subject"

  - id: block_preparation
    type: ontology
    group: specimen
    scopes: [ clinical ]
    label: "Block preparation"
    description: "The preservation technique used."
    ontology:
      id: SCTID
    ontologyConcept:
      - "311731000"  # Paraffin wax (substance)
      - "433469005"  # Frozen section embedding medium (substance)
      - "61088005"   # Plastic (substance)
      - "10249006"   # Agar (substance)
      - "65345002"   # Epoxy resin (substance)
      - "261712009"  # Acrylic polymer (substance)
    ui_group: "sample"

  - id: specimen_type
    type: ontology
    group: specimen
    scopes: [ clinical ]
    label: "Specimen type"
    description: "The type of the specimen."
    ontology:
      id: SCTID
    ontologyConcept: "91720002"  # Body substance (substance)
    ui_group: "sample"

  - id: fixation_type
    type: ontologyOrValue
    group: specimen
    scopes: [ clinical ]
    label: "Fixation type"
    description: "The type of fixation used in the process of the creation of the specimen."
    ontology:
      id: SCTID
    ontologyConcept: "1388477003"  # Tissue fixative (product)
    ui_group: "sample"

  - id: staining_target
    type: keyword
    group: staining
    scopes: [ clinical ]
    label: "Staining target"
    description: "The specific target of the stain"
    ui_group: "staining"

  - id: staining_procedure
    type: ontologyOrValue
    group: staining
    scopes: [ clinical ]
    label: "Staining procedure"
    description: "The name of the staining procedure that was performed to stain the slide"
    ontology:
      id: SCTID
    ontologyConcept: "127790008"  # Staining method (procedure)
    ui_group: "staining"

  - id: staining_substance
    type: ontologyOrValue
    group: staining
    scopes: [ clinical ]
    label: "Staining substance"
    description: "The staining substance that binds to parts of the tissues of the slide"
    ontology:
      id: SCTID
    ontologyConcept: "397165007"  # Stain
    ui_group: "staining"

  - id: diagnosis
    type: ontology
    scopes: [ clinical ]
    label: "Diagnosis"
    description: "Diagnosis known to apply to one more image linked to an observation."
    ontology:
      id: SCTID
    ontologyConcept: "138875005"  # SNOMED CT Concept (root)
    multivalued: true
    ui_group: "clinical"

  - id: diagnosis_candidate
    type: ontology
    scopes: [ clinical ]
    label: "Diagnosis (candidate)"
    description: "Diagnosis known to apply to at least one, but not necessarily all, images linked to an observation."
    ontology:
      id: SCTID
    ontologyConcept: "138875005"  # SNOMED CT Concept (root)
    multivalued: true
    ui_group: "clinical"


# Fields that are indexed in OpenSearch but are not filterable.
# All are top-level (no group).
non_filtering_fields:
  - id: image_id
    type: keyword

  - id: dataset_id
    type: keyword

  - id: dataset_image_cnt
    type: integer

  - id: dataset_short_name
    type: text
