[tox]
envlist = ruff, mypy, pytest
skipsdist = True

# `ruff` fixes what it can, for local runs; `ruff-check` only reports, for CI.
[testenv:ruff{,-check}]
basepython = python3.14
runner = uv-venv-lock-runner
extras = tox
package = skip
allowlist_externals = ruff
# Report both format and lint problems, not only the first.
ignore_errors =
    check: true
    !check: false
commands =
    !check: ruff format search_api scripts tests
    !check: ruff check --fix search_api scripts tests
    check: ruff format --check search_api scripts tests
    check: ruff check search_api scripts tests

[testenv:mypy]
basepython = python3.14
runner = uv-venv-lock-runner
extras = tox
allowlist_externals = mypy
commands = mypy search_api scripts

[testenv:pytest]
basepython = python3.14
runner = uv-venv-lock-runner
extras = tox
allowlist_externals = pytest
commands = pytest -x --cov=search_api tests/unit/
